[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtls"
version = "0.1.0"
description = "Experimental TLS 1.3 implementation with a pluggable byte transport."
requires-python = ">=3.10"
dependencies = [
    "cryptography>=45.0.0",
]

[tool.setuptools.packages.find]
include = ["qtls*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
